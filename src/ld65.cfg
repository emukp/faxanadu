# ============================================================================
# ld65 linker configuration - Faxanadu (U), zh_version (256 KiB PRG)
#
# MEMORY declaration order IS the ROM file order: ld65 writes each region that
# has file=%O in the order it appears here.  One consequence is easy to get
# wrong (verified experimentally): a region that no SEGMENT loads into is NOT
# written to the file at all, which silently shortens the image.  Every bank
# below therefore has a matching SEGMENTS entry.
#
# Bank map (16 x 16 KiB = 256 KiB, exactly the original image size):
#   0-8, 10-12, 14  PRG0..PRG14   original banks, byte-identical to the cart
#   9               PRG9          BANK_9_UNUSED in the original ($FF); now holds
#                                 the zh_version glyph table + renderer
#   13              PRG13         original message/string bank (Step C test text)
#   15              PRG15         fixed bank + END_OF_ROM; it is the LAST bank in
#                                 the file, so the MMC1 maps it to $C000-$FFFF
#                                 and the vectors work without a second copy
#
# WHY NOT 512 KiB: the zh_version branch tried a 32-bank image (keeping bank 15
# and appending a copy as bank 31).  That cannot work on MMC1: with 16 KiB PRG
# mode selected (which this game needs, so the fixed bank stays at $C000) the
# PRG bank register's low 4 bits are the whole bank number, so only banks 0-15
# are reachable at $8000-$BFFF - writing 16 selects bank 0.  Measured with a
# throwaway ROM that selected each bank and read a signature byte back; see
# docs/hanhua-12x12.md ("MMC1 只能寻址 banks 0-15").  The extra banks were
# therefore unreachable dead weight, and the image is back to 256 KiB, which
# also makes the iNES header a plain, unambiguous one.
#
# The $3FE0 + $20 split of the fixed bank is not cosmetic: END_OF_ROM sits at
# $FFE0, so pairing the two exactly tiles one 16 KiB bank.  Using $4000 for
# PRG15 would push END_OF_ROM onto the next 16 KiB file boundary.
# ============================================================================
MEMORY {
	ZP:  start=$0000, size=$0100, type=rw, file="";
	RAM: start=$0100, size=$0800, type=rw, file="";
	PPU: start=$2000, size=$0008, type=rw, file="";
	APU_IO: start=$4000, size=$0018, type=rw, file="";
	HDR: start=$0000, size=$0010, type=ro, file=%O, fill=yes, fillval=$00;
	PRG0: start=$8000, size=$4000, type=ro, file=%O, fill=yes, fillval=$00;
	PRG1: start=$8000, size=$4000, type=ro, file=%O, fill=yes, fillval=$00;
	PRG2: start=$8000, size=$4000, type=ro, file=%O, fill=yes, fillval=$00;
	PRG3: start=$8000, size=$4000, type=ro, file=%O, fill=yes, fillval=$00;
	PRG4: start=$8000, size=$4000, type=ro, file=%O, fill=yes, fillval=$00;
	PRG5: start=$8000, size=$4000, type=ro, file=%O, fill=yes, fillval=$00;
	PRG6: start=$8000, size=$4000, type=ro, file=%O, fill=yes, fillval=$00;
	PRG7: start=$8000, size=$4000, type=ro, file=%O, fill=yes, fillval=$00;
	PRG8: start=$8000, size=$4000, type=ro, file=%O, fill=yes, fillval=$00;
	PRG9: start=$8000, size=$4000, type=ro, file=%O, fill=yes, fillval=$00;
	PRG10: start=$8000, size=$4000, type=ro, file=%O, fill=yes, fillval=$00;
	PRG11: start=$8000, size=$4000, type=ro, file=%O, fill=yes, fillval=$00;
	PRG12: start=$8000, size=$4000, type=ro, file=%O, fill=yes, fillval=$00;
	PRG13: start=$8000, size=$4000, type=ro, file=%O, fill=yes, fillval=$00;
	PRG14: start=$8000, size=$4000, type=ro, file=%O, fill=yes, fillval=$00;
	PRG15: start=$C000, size=$3FE0, type=ro, file=%O, fill=yes, fillval=$00;
	ROM_TAIL: start=$FFE0, size=$20, type=ro, file=%O, fill=yes, fillval=$00;
}

SEGMENTS {
	ZEROPAGE: load=ZP, type=zp;
    #OAM:      load=OAM, type=bss, align=$100;
	PPU:      load=PPU, type=bss;
	APU_IO:   load=APU_IO, type=bss;
    RAM:      load=RAM, type=bss;
    HEADER:   load=HDR, type=ro;
    PRG0:     load=PRG0, type=ro,  start=$8000;
    PRG1:     load=PRG1, type=ro,  start=$8000;
    PRG2:     load=PRG2, type=ro,  start=$8000;
    PRG3:     load=PRG3, type=ro,  start=$8000;
    PRG4:     load=PRG4, type=ro,  start=$8000;
    PRG5:     load=PRG5, type=ro,  start=$8000;
    PRG6:     load=PRG6, type=ro,  start=$8000;
    PRG7:     load=PRG7, type=ro,  start=$8000;
    PRG8:     load=PRG8, type=ro,  start=$8000;
    PRG9:     load=PRG9, type=ro,  start=$8000;
    PRG9_CODE: load=PRG9, type=ro;
    PRG10:     load=PRG10, type=ro,  start=$8000;
    PRG11:     load=PRG11, type=ro,  start=$8000;
    PRG12:     load=PRG12, type=ro,  start=$8000;
    PRG13:     load=PRG13, type=ro,  start=$8000;
    PRG14:     load=PRG14, type=ro,  start=$8000;
    PRG15:     load=PRG15, type=ro;
	END_OF_ROM: load=ROM_TAIL, type=ro, optional=yes;
}
